name: Continuous Integration - Flutter

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  test-lint-web:
    name: Test and Lint Web App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "./flashcard"
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup and Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Enable Web
        run: flutter config --enable-web
      - name: Install Flutter Dependencies
        run: flutter pub get
      - name: Run Flutter Linter
        run: flutter analyze
      - name: Run Flutter Unit and Widget Tests
        run: flutter test test
      - name: Start Chromedriver for Integration Tests
        run: chromedriver --port=4444 &
      - name: Run Flutter Integration Tests
        run: flutter drive --driver=test_driver/integration_test_driver.dart --target=integration_test/app_test.dart -d web-server --headless

