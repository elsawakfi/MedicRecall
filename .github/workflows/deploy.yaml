name: Continuous Deployment - Flutter
on:
  push:
    branches: [cd-implementation]
defaults:
  run:
    working-directory: flashcard
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter test
      - run: flutter config --enable-web
      - run: flutter build web --release
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FLASHCARD_6EDC2 }}
#          channelId: live # This is for deploying to production
          channelId: continuous-deployment # This deploys to a preview channel
          projectId: flashcard-6edc2
          entryPoint: flashcard