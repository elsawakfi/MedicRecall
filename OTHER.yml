name: MedicRecall2 Issue Report
description: Submit a issue report to help us improve!
title: "[Type of Issue]"
projects: ["spe-upb/2024-MedicRecall2"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type of Issue
      options:
        - New Feature
        - Enchacement/ Improvement
        - Documentation
        - Adhoc
        - Bug
      required: true
      validation_message: Please select the type of issue      

  - type: textarea
    id: description
    attributes:
      label: Is your feature request related to a problem? Please describe.
      placeholder: Describe the feature request in detail
      required: true
      validation_message: Please provide a description for the issue

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like to add
      placeholder: Describe the solution in detail
      required: true
      validation_message: Please provide a solution for the issue

  - type: textarea
    id: additional_info
    attributes:
      label: Additional context
      placeholder: Add any other context or screenshots about the feature request here

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: [ ] I've linked this issue to a branch
          required: true
        - label: [ ] I've add in the target date
          required: true
        - label: [ ] I've added in the assignee
          required: true
        - label: [ ] I've assigned this issue to the respective PIC
          required: true
        - label: [ ] I've set the priority and labels for this issue
          required: true